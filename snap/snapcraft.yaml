name: idiot
base: core24
version: git
summary: Shell environment manager for Ubuntu Core / IoT snap development
description: |
  idiot is a CLI for Ubuntu Core and snap store development workflows.
  It manages store credentials, dedicated snap stores, and target
  architectures; inspects disk images and snap packages; launches QEMU
  VMs; manages model assertions; and provides process checklists and
  to-do lists for common IoT development tasks.

grade: devel
# idiot drives host tools (qemu, lxc, snap, snapcraft, git), writes wherever
# the user points it, and changes the calling shell: strict confinement
# can't express that.
confinement: classic

components:
  core:
    type: standard
    summary: Core device inspection tools
    description: |
      Additional tools for running idiot directly on an Ubuntu Core device,
      including filesystem inspection utilities (e2fsprogs, mtools) and
      partition tools (util-linux, dosfstools).
      Install with: snap install idiot+core

apps:
  idiot:
    command: bin/idiot
    environment:
      IDIOT_ROOT: ${SNAP}/lib/idiot

parts:
  idiot:
    plugin: nil
    source: .
    build-packages:
      - git
      - make
    override-build: |
      # the snap's own version comes from `version: git`; this is the one
      # `idiot version` prints
      VERSION=$(git describe --tags --always --dirty 2>/dev/null || printf 'unknown')
      make VERSION="$VERSION" PREFIX="${CRAFT_PART_INSTALL}" install
  packages:
    plugin: nil
    # classic snap: point bundled ELF binaries at core24's loader and libs
    build-attributes:
      - enable-patchelf
    stage-packages:
      - fzf
  core-packages:
    plugin: nil
    build-attributes:
      - enable-patchelf
    organize:
      '*': (component/core)/
    stage-packages:
      - e2fsprogs
      - mtools
      - python3-minimal
      - util-linux
      - dosfstools
      - tpm2-tools
