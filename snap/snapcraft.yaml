name: idiot
base: core24
version: '0.1'
summary: Interactive Development for IoT
description: |
  This is my-snap's description. You have a paragraph or two to tell the
  most important story about your snap. Keep it under 100 words though,
  we live in tweetspace and your description wants to look good in the snap
  store.

grade: stable
confinement: classic

apps:
  idiot:
    command: bin/iot
    environment:
      IDIOT_BIN: $SNAP/usr/bin
      IDIOT_DATA_ROOT: $SNAP_USER_COMMON

parts:
  src:
    plugin: dump
    source: ./src

  packages:
    plugin: nil
    stage-packages:
      - fzf
      - bat
    build-attributes:
      - enable-patchelf
    prime:
      - -usr/share
