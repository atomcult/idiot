name: idiot
base: core24
version: git
summary: Shell environment manager for Ubuntu Core / IoT snap development
description: |
  idiot is a CLI for Ubuntu Core and snap store development workflows.
  It manages store credentials, dedicated snap stores, and target
  architectures; inspects disk images and snap packages; launches QEMU
  VMs; manages model assertions; and provides process checklists and
  to-do lists for common IoT development tasks.

grade: devel
# Strict with no plugs: confined, idiot only touches its own state and the
# bundled fzf. Anything else (host tools, network, devices, user files) is
# handed back to the user's shell and runs there from /snap/idiot/current
# (see `# idiot: host` and emit_handoff in share/common.sh).
confinement: strict

# Optional tool groups, installed with `snap install idiot+<name>`. Their
# tools only run host-side (see snap_tool_dirs in share/common.sh).
components:
  core:
    type: standard
    summary: Disk image inspection tools
    description: |
      Filesystem, partition and archive tools for inspecting Ubuntu Core
      and other disk images (`idiot inspect image`): e2fsprogs, mtools,
      dosfstools, util-linux, fdisk, gdisk, parted, erofs-utils, zstd, lz4,
      cpio and simg2img.
      Install with: snap install idiot+core
  vm:
    type: standard
    summary: Virtual machine tools
    description: |
      qemu for amd64, arm64, armhf and riscv64 targets, qemu-img, and the
      UEFI firmware `idiot vm` boots (OVMF, AAVMF, ARM and RISC-V EFI).
      Install with: snap install idiot+vm
  tpm:
    type: standard
    summary: TPM tools
    description: |
      tpm2-tools and swtpm: talk to a real or emulated TPM, and give
      `idiot vm --tpm` its emulated TPM.
      Install with: snap install idiot+tpm
  network:
    type: standard
    summary: Network introspection tools
    description: |
      tcpdump, nmap, iw, dig/host/nslookup, traceroute, mtr, iperf3,
      socat, curl, nft, conntrack, arping, tracepath and whois.
      Install with: snap install idiot+network
  hardware:
    type: standard
    summary: Hardware introspection tools
    description: |
      lspci, lsusb, i2c-tools, dmidecode, lshw, smartctl, nvme-cli, the
      gpiod tools, can-utils, picocom, mmc-utils and flashrom.
      Install with: snap install idiot+hardware
  boot:
    type: standard
    summary: Boot chain and secure boot tools
    description: |
      efibootmgr, mokutil, efitools, keyutils, u-boot-tools (mkimage,
      fw_printenv), the device-tree compiler (dtc, fdtdump) and
      sbsigntool.
      Install with: snap install idiot+boot
  debug:
    type: standard
    summary: Process and binary debugging tools
    description: |
      strace, ltrace, gdb, lsof, file, binutils, elfutils, jq, psmisc,
      sysstat, htop, hexdump and patchelf.
      Install with: snap install idiot+debug

apps:
  idiot:
    command: bin/idiot
    environment:
      IDIOT_ROOT: ${SNAP}/lib/idiot

parts:
  idiot:
    plugin: nil
    # the source is only for change detection (an outdated pull reruns
    # override-pull); the default pull would copy build output too
    # (tools/idiot-store/target), so override-pull replaces it
    source: .
    override-pull: |
      "${CRAFT_PROJECT_DIR}/snap/local/pull-tracked"
    build-packages:
      - git
      - make
    override-build: |
      # the snap's own version comes from `version: git`; this is the one
      # `idiot version` prints (the pulled copy has no .git)
      VERSION=$(git -C "${CRAFT_PROJECT_DIR}" -c safe.directory='*' \
          describe --tags --always --dirty 2>/dev/null || printf 'unknown')
      # the store helper is built by its own part
      make VERSION="$VERSION" PREFIX="${CRAFT_PART_INSTALL}" install-sh
  idiot-store:
    plugin: rust
    # pinned like everything else (keep in step with override-pull)
    rust-channel: "1.91.1"
    # the rust plugin requires a source, but the override-pull replaces the
    # default pull, which would copy target/ too: nothing is copied from it
    source: tools/idiot-store
    override-pull: |
      "${CRAFT_PROJECT_DIR}/snap/local/pull-tracked" tools/idiot-store
      # the plugin installs its toolchain in the default pull, which this
      # replaces: install the rust-channel version here
      rustup toolchain install 1.91.1 --profile minimal
    build-packages:
      - git
    # runs host-side only (auth add/status are host commands): load core24's
    # loader and libc there, like the other host binaries
    build-attributes:
      - enable-patchelf
    organize:
      bin/idiot-store: lib/idiot/libexec/idiot-store
  packages:
    plugin: nil
    build-packages:
      - patchelf
      - binutils # readelf, for patchelf-host's check
    # fzf runs confined as packaged (core24 is / there). Host commands get a
    # patched copy in host/bin: a patched binary looks in /snap/core24/<rev>,
    # which AppArmor won't let a confined process read.
    override-build: |
      craftctl default
      mkdir -p "${CRAFT_PART_INSTALL}/host/bin"
      cp -p "${CRAFT_PART_INSTALL}/usr/bin/fzf" "${CRAFT_PART_INSTALL}/host/bin/"
      "${CRAFT_PROJECT_DIR}/snap/local/patchelf-host" \
          "${CRAFT_PART_INSTALL}" "${CRAFT_ARCH_TRIPLET_BUILD_FOR}" host
    stage-packages:
      - fzf
  # One part per component, each finished by snap/local/component-build:
  # patched to run host-side (snapcraft's enable-patchelf skips files
  # organised into a component), pruned, and indexed (idiot-index/<name>).
  # component-index copies the indexes into the main snap.
  core-packages:
    plugin: nil
    build-packages: &component-build-packages
      - patchelf
      - binutils # readelf, for patchelf-host's check
    override-build: &component-build |
      craftctl default
      "${CRAFT_PROJECT_DIR}/snap/local/component-build" "${CRAFT_PART_NAME%-packages}"
    organize:
      '*': (component/core)/
    stage-packages:
      - e2fsprogs
      - mtools
      - util-linux
      - fdisk
      - dosfstools
      - gdisk
      - parted
      - erofs-utils
      - zstd
      - lz4
      - cpio
      - android-sdk-libsparse-utils
  vm-packages:
    plugin: nil
    build-packages: *component-build-packages
    # pruned to what idiot vm uses (snap/local/vm-build), then finished
    # like the others
    override-build: |
      craftctl default
      "${CRAFT_PROJECT_DIR}/snap/local/vm-build"
      "${CRAFT_PROJECT_DIR}/snap/local/component-build" vm
    organize:
      '*': (component/vm)/
    stage-packages:
      - qemu-system-x86
      - qemu-system-arm
      - qemu-system-misc
      - qemu-utils
      - ovmf
      - qemu-efi-aarch64
      - qemu-efi-arm
      - qemu-efi-riscv64
  tpm-packages:
    plugin: nil
    build-packages: *component-build-packages
    override-build: *component-build
    organize:
      '*': (component/tpm)/
    stage-packages:
      - tpm2-tools
      - libtss2-tcti-swtpm0t64
      - libtss2-tcti-device0t64
      - libtss2-tcti-mssim0t64
      - swtpm
      - swtpm-tools
  network-packages:
    plugin: nil
    build-packages: *component-build-packages
    # traceroute's name comes from update-alternatives in its postinst,
    # which stage-packages never run
    override-build: |
      craftctl default
      ln -sfn traceroute.db "${CRAFT_PART_INSTALL}/usr/bin/traceroute"
      "${CRAFT_PROJECT_DIR}/snap/local/component-build" network
    organize:
      '*': (component/network)/
    stage-packages:
      - tcpdump
      - nmap
      - iw
      - bind9-dnsutils
      - bind9-host
      - traceroute
      - mtr-tiny
      - iperf3
      - socat
      - curl
      - nftables
      - conntrack
      - arping
      - iputils-tracepath
      - whois
  hardware-packages:
    plugin: nil
    build-packages: *component-build-packages
    override-build: *component-build
    organize:
      '*': (component/hardware)/
    stage-packages:
      - pciutils
      - usbutils
      - i2c-tools
      - dmidecode
      - lshw
      - smartmontools
      - nvme-cli
      - gpiod
      - can-utils
      - picocom
      - mmc-utils
      - flashrom
  boot-packages:
    plugin: nil
    build-packages: *component-build-packages
    override-build: *component-build
    organize:
      '*': (component/boot)/
    stage-packages:
      - efibootmgr
      - mokutil
      - efitools
      - keyutils
      - u-boot-tools
      - libubootenv-tool
      - device-tree-compiler
      - sbsigntool
  debug-packages:
    plugin: nil
    build-packages: *component-build-packages
    override-build: *component-build
    organize:
      '*': (component/debug)/
    stage-packages:
      - strace
      - ltrace
      - gdb
      - lsof
      - file
      - libmagic-mgc # its database; core24 has libmagic1t64 but not this
      - binutils
      - elfutils
      - jq
      - psmisc
      - sysstat
      - htop
      - bsdextrautils
      - patchelf
  # The components' tool indexes, in the main snap so idiot can name a
  # component that isn't installed. A part can't organise a file into
  # another partition, so this one reads each component's stage dir.
  component-index:
    plugin: nil
    after:
      - core-packages
      - vm-packages
      - tpm-packages
      - network-packages
      - hardware-packages
      - boot-packages
      - debug-packages
    override-build: |
      dest="${CRAFT_PART_INSTALL}/lib/idiot/share/components"
      mkdir -p "${dest}"
      for comp in core vm tpm network hardware boot debug; do
        stage="$(printenv "CRAFT_COMPONENT_${comp^^}_STAGE")"
        cp "${stage}/idiot-index/${comp}" "${dest}/${comp}"
      done
