name: idiot
base: core24
version: git
summary: Shell environment manager for Ubuntu Core / IoT snap development
description: |
  idiot is a CLI for Ubuntu Core and snap store development workflows.
  It manages store credentials, dedicated snap stores, and target
  architectures; inspects disk images and snap packages; launches QEMU
  VMs; manages model assertions; and provides process checklists and
  to-do lists for common IoT development tasks.

grade: devel
# Strict with no plugs: confined, idiot only touches its own state and the
# bundled fzf. Anything else (host tools, network, devices, user files) is
# handed back to the user's shell and runs there from /snap/idiot/current
# (see `# idiot: host` and emit_handoff in share/common.sh).
confinement: strict

components:
  core:
    type: standard
    summary: Core device inspection tools
    description: |
      Additional tools for running idiot directly on an Ubuntu Core device,
      including filesystem inspection utilities (e2fsprogs, mtools) and
      partition tools (util-linux, dosfstools).
      Install with: snap install idiot+core

apps:
  idiot:
    command: bin/idiot
    environment:
      IDIOT_ROOT: ${SNAP}/lib/idiot

parts:
  idiot:
    plugin: nil
    # no `source: .`: it would copy build output too (tools/idiot-store/target)
    override-pull: |
      "${CRAFT_PROJECT_DIR}/snap/local/pull-tracked"
    build-packages:
      - git
      - make
    override-build: |
      # the snap's own version comes from `version: git`; this is the one
      # `idiot version` prints (the pulled copy has no .git)
      VERSION=$(git -C "${CRAFT_PROJECT_DIR}" -c safe.directory='*' \
          describe --tags --always --dirty 2>/dev/null || printf 'unknown')
      # the store helper is built by its own part
      make VERSION="$VERSION" PREFIX="${CRAFT_PART_INSTALL}" install-sh
  idiot-store:
    plugin: rust
    # the rust plugin requires a source, but the override-pull replaces the
    # default pull, which would copy target/ too: nothing is copied from it
    source: tools/idiot-store
    override-pull: |
      "${CRAFT_PROJECT_DIR}/snap/local/pull-tracked" tools/idiot-store
    build-packages:
      - git
    # runs host-side only (auth add/status are host commands): load core24's
    # loader and libc there, like the other host binaries
    build-attributes:
      - enable-patchelf
    organize:
      bin/idiot-store: lib/idiot/libexec/idiot-store
  packages:
    plugin: nil
    build-packages:
      - patchelf
    # fzf runs confined as packaged (core24 is / there). Host commands get a
    # patched copy in host/bin: a patched binary looks in /snap/core24/<rev>,
    # which AppArmor won't let a confined process read.
    override-build: |
      craftctl default
      mkdir -p "${CRAFT_PART_INSTALL}/host/bin"
      cp -p "${CRAFT_PART_INSTALL}/usr/bin/fzf" "${CRAFT_PART_INSTALL}/host/bin/"
      "${CRAFT_PROJECT_DIR}/snap/local/patchelf-host" \
          "${CRAFT_PART_INSTALL}" "${CRAFT_ARCH_TRIPLET_BUILD_FOR}" host
    stage-packages:
      - fzf
  core-packages:
    plugin: nil
    build-packages:
      - patchelf
    # the component's tools only run host-side: patch them all (snapcraft's
    # enable-patchelf skips files organised into a component)
    override-build: |
      craftctl default
      "${CRAFT_PROJECT_DIR}/snap/local/patchelf-host" \
          "${CRAFT_PART_INSTALL}" "${CRAFT_ARCH_TRIPLET_BUILD_FOR}"
    organize:
      '*': (component/core)/
    # no python3: core24 ships it (confined) and every host has its own
    stage-packages:
      - e2fsprogs
      - mtools
      - util-linux
      - dosfstools
      - tpm2-tools
